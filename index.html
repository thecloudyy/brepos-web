<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>brepos — secure download</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --card: rgba(23, 26, 33, .92);
    --line: #262b36;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --dim: #6b7280;
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --ok: #3fb950;
    --err: #ff6b6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(79,140,255,.14), transparent 60%),
      radial-gradient(700px 480px at 110% 110%, rgba(124,92,255,.12), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: min(440px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(22px, 5vw, 34px) clamp(18px, 5vw, 30px) clamp(18px, 4vw, 24px);
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
    backdrop-filter: blur(8px);
    animation: rise .35s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    #fill, #spin { animation: none !important; transition: none !important; }
  }

  /* header */
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .logo {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: 0 8px 22px rgba(79,140,255,.35);
  }
  .logo svg { width: 22px; height: 22px; fill: #fff; }
  h1 { margin: 0; font-size: clamp(22px, 6vw, 27px); letter-spacing: .3px; line-height: 1.1; }
  .sub { margin: 3px 0 0; color: var(--muted); font-size: clamp(13px, 3.5vw, 14px); }

  /* file chip */
  .file {
    display: flex; align-items: center; gap: 12px;
    background: #12151c; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 18px;
  }
  .file svg { flex: none; width: 26px; height: 26px; fill: var(--accent); }
  .fname { font-weight: 600; font-size: 14.5px; }
  .fmeta { color: var(--dim); font-size: 12.5px; margin-top: 2px; }

  /* form */
  form { display: flex; flex-direction: column; gap: 10px; }
  .field { position: relative; }
  input {
    width: 100%; padding: 13px 46px 13px 14px; font-size: 16px; /* 16px prevents iOS zoom */
    border-radius: 11px; border: 1px solid #303747; background: #0d1016;
    color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #5b6474; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.22); }
  #peek {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 9px; cursor: pointer; color: var(--muted);
  }
  #peek:hover { color: var(--text); background: rgba(255,255,255,.05); }
  #peek:not(.off) #eye-off, #peek.off #eye-on { display: none; } /* hidden is HTMLElement-only; SVG needs CSS */
  #peek svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  button[type=submit] {
    min-height: 48px; padding: 13px 16px; font-size: 15.5px; font-weight: 650;
    border: 0; border-radius: 11px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), #3d7bf0);
    box-shadow: 0 10px 24px rgba(79,140,255,.32);
    transition: transform .12s, filter .15s, opacity .15s;
  }
  button[type=submit]:hover { filter: brightness(1.07); }
  button[type=submit]:active { transform: translateY(1px) scale(.995); }
  button[type=submit]:disabled { opacity: .6; cursor: default; box-shadow: none; }
  @media (min-width: 460px) {
    form { flex-direction: row; align-items: stretch; }
    .field { flex: 1 1 auto; }
    button[type=submit] { flex: 0 0 auto; padding-inline: 22px; }
  }

  /* progress */
  .prog { margin-top: 14px; }
  .prog[hidden] { display: none; }
  .bar { height: 7px; border-radius: 99px; background: #1b2029; overflow: hidden; position: relative; }
  #fill {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 99px; transition: width .18s ease;
  }
  .bar.indet #fill { width: 34% !important; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -34%; } 100% { margin-left: 100%; } }
  .prow { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12px; color: var(--muted); }

  /* status */
  #status {
    min-height: 20px; margin: 14px 0 0; font-size: 13.5px; line-height: 1.5;
    display: flex; align-items: flex-start; gap: 8px;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #status.busy { color: var(--muted); }
  #spin {
    flex: none; width: 14px; height: 14px; margin-top: 3px; border-radius: 50%;
    border: 2px solid rgba(152,162,179,.35); border-top-color: var(--muted);
    animation: rot .7s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  #status:not(.busy) #spin { display: none; }

  footer {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 11.5px; letter-spacing: .3px;
  }

  /* drive view */
  #drive { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  #drive[hidden] { display: none; }
  .dhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .dtitle { font-weight: 650; font-size: 14.5px; }
  .dmeta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .dbtn {
    flex: none; min-height: 36px; padding: 8px 14px; font-size: 13px; font-weight: 650;
    color: #fff; border: 0; border-radius: 9px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .dbtn:hover { filter: brightness(1.08); }
  .tree {
    max-height: min(48vh, 440px); overflow: auto;
    background: #12151c; border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  }
  details { margin: 0; }
  details > summary {
    list-style: none; cursor: pointer; padding: 7px 8px; border-radius: 8px;
    font-size: 13px; display: flex; gap: 7px; align-items: center;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary:hover { background: rgba(255,255,255,.05); }
  summary .caret { transition: transform .15s; color: var(--dim); font-size: 10px; }
  details[open] > summary .caret { transform: rotate(90deg); }
  summary .dname { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  summary .fcount { color: var(--dim); font-size: 11.5px; margin-left: auto; flex: none; }
  .frow { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 24px; font-size: 13px; border-radius: 8px; }
  .frow:hover { background: rgba(255,255,255,.04); }
  .fname2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cdd5e0; }
  .fsize { color: var(--dim); font-size: 11.5px; flex: none; }
  .fget {
    flex: none; border: 1px solid #303747; background: #171b23; color: var(--muted);
    font-size: 11.5px; padding: 4px 9px; border-radius: 7px; cursor: pointer; min-height: 28px;
  }
  .fget:hover { color: var(--text); border-color: var(--accent); }
  .fget:disabled { opacity: .5; }
  @media (max-width: 400px) { .fsize { display: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-2V7a5 5 0 0 0-5-5Zm3 8H9V7a3 3 0 1 1 6 0v3Z"/></svg>
    </span>
    <div>
      <h1>brepos</h1>
      <p class="sub">Encrypted archive &mdash; enter your key to download.</p>
    </div>
  </div>

  <div class="file">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm-1 7V3.5L18.5 9H13Z"/></svg>
    <div>
      <div class="fname">brepos.zip</div>
      <div class="fmeta" id="fmeta">encrypted archive</div>
    </div>
  </div>

  <form id="f" autocomplete="off">
    <div class="field">
      <input id="key" type="password" placeholder="Access key" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Access key" autofocus>
      <button type="button" id="peek" aria-label="Show key" aria-pressed="false">
        <svg id="eye-on" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-3.4 4.4M6.6 6.6A17.6 17.6 0 0 0 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <button id="btn" type="submit">Unlock &amp; download</button>
  </form>

  <div class="prog" id="prog" hidden>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="prow"><span id="stage">Downloading&hellip;</span><span id="bytes">0 KB</span></div>
  </div>

  <p id="status" role="status" aria-live="polite"><span id="spin" aria-hidden="true"></span><span id="msg"></span></p>

  <section id="drive" hidden>
    <div class="dhead">
      <div>
        <div class="dtitle">Uploaded files</div>
        <div class="dmeta" id="dmeta"></div>
      </div>
      <button type="button" class="dbtn" id="dlAll">Download all</button>
    </div>
    <div class="tree" id="tree"></div>
  </section>

  <footer><span>AES-256-GCM</span><span>decrypts in your browser</span></footer>
</main>

<script>
const OBJ = 'https://xdjzkabjzxgmtaxrwwgt.supabase.co/storage/v1/object/public/brepos/brepos.enc';
const ITER = 100000;                       // PBKDF2 iterations — must match the publisher exe
const enc = new TextEncoder();

const f = document.getElementById('f');
const keyInput = document.getElementById('key');
const btn = document.getElementById('btn');
const peek = document.getElementById('peek');
const prog = document.getElementById('prog');
const bar = document.getElementById('bar');
const fill = document.getElementById('fill');
const stage = document.getElementById('stage');
const bytesEl = document.getElementById('bytes');
const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');
const fmeta = document.getElementById('fmeta');
const drive = document.getElementById('drive');
const tree = document.getElementById('tree');
const dmeta = document.getElementById('dmeta');
const dlAll = document.getElementById('dlAll');
let unlockedZip = null;   // Uint8Array of the decrypted zip
let unlockedBlob = null;  // full zip blob for "Download all"

dlAll.addEventListener('click', () => {
  if (unlockedBlob) saveBlob(unlockedBlob, 'brepos.zip');
});

function status(msg, cls) {
  statusEl.className = cls || '';
  msgEl.textContent = msg;
}
function fmt(n) {
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

// ---- zip reading: central directory parse + on-demand inflate ----
function readZipEntries(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const stop = Math.max(0, u8.length - 22 - 65535);
  for (let i = u8.length - 22; i >= stop; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip-eocd');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(off, true) !== 0x02014b50) throw new Error('zip-cd');
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const uncompSize = dv.getUint32(off + 24, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const commentLen = dv.getUint16(off + 32, true);
    const localOff = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nameLen));
    entries.push({ name, method, compSize, uncompSize, localOff });
    off += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

async function inflateEntry(u8, e) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  if (dv.getUint32(e.localOff, true) !== 0x04034b50) throw new Error('zip-lh');
  const nameLen = dv.getUint16(e.localOff + 26, true);
  const extraLen = dv.getUint16(e.localOff + 28, true);
  const start = e.localOff + 30 + nameLen + extraLen;
  const raw = u8.subarray(start, start + e.compSize);
  if (e.method === 0) return raw.slice();
  if (e.method !== 8) throw new Error('zip-method');
  if (typeof DecompressionStream === 'undefined') throw new Error('no-inflate');
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// ---- drive tree ----
function ensurePath(node, parts) {
  for (const p of parts) {
    if (!node.dirs.has(p)) node.dirs.set(p, { dirs: new Map(), files: [] });
    node = node.dirs.get(p);
  }
  return node;
}

function statNode(node) {
  let files = 0, bytes = 0;
  for (const f of node.files) { files++; bytes += f.uncompSize; }
  for (const c of node.dirs.values()) { const s = statNode(c); files += s.files; bytes += s.bytes; }
  return { files, bytes };
}

function countFolders(node) {
  let c = 0;
  for (const [, child] of node.dirs) { c += 1 + countFolders(child); }
  return c;
}

function buildTree(entries) {
  const root = { dirs: new Map(), files: [] };
  for (const e of entries) {
    const parts = e.name.split('/').filter(Boolean);
    if (!parts.length) continue;
    if (e.name.endsWith('/')) ensurePath(root, parts);
    else ensurePath(root, parts.slice(0, -1)).files.push(e);
  }
  return root;
}

function renderNode(container, node, depth) {
  for (const [name, child] of [...node.dirs].sort((a, b) => a[0].localeCompare(b[0]))) {
    const det = document.createElement('details');
    det.open = depth < 2;
    const sum = document.createElement('summary');
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = '\u25b6';
    const label = document.createElement('span'); label.className = 'dname'; label.textContent = name + '/';
    const s = statNode(child);
    const cnt = document.createElement('span'); cnt.className = 'fcount';
    cnt.textContent = s.files + ' files \u00b7 ' + fmt(s.bytes);
    sum.append(caret, label, cnt);
    det.appendChild(sum);
    const sub = document.createElement('div');
    renderNode(sub, child, depth + 1);
    det.appendChild(sub);
    container.appendChild(det);
  }
  for (const e of [...node.files].sort((a, b) => a.name.localeCompare(b.name))) {
    const row = document.createElement('div'); row.className = 'frow';
    const base = e.name.split('/').pop();
    const nm = document.createElement('span'); nm.className = 'fname2'; nm.textContent = base;
    const sz = document.createElement('span'); sz.className = 'fsize'; sz.textContent = fmt(e.uncompSize);
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fget'; btn.textContent = 'Save';
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const data = await inflateEntry(unlockedZip, e);
        saveBlob(new Blob([data]), base);
        status('Saved ' + base + ' (' + fmt(data.length) + ')', 'ok');
      } catch (err) {
        status('Could not extract ' + base + ' in this browser.', 'err');
      } finally { btn.disabled = false; }
    });
    row.append(nm, sz, btn);
    container.appendChild(row);
  }
}

function renderDrive(u8) {
  const entries = readZipEntries(u8);
  const root = buildTree(entries);
  const s = statNode(root);
  dmeta.textContent = s.files + ' files \u00b7 ' + countFolders(root) + ' folders \u00b7 ' + fmt(s.bytes);
  tree.textContent = '';
  renderNode(tree, root, 0);
  // debug/verification handles
  window.__entries = entries;
  window.__inflate = (e) => inflateEntry(unlockedZip, e);
  drive.hidden = false;
}

// key peek toggle
peek.addEventListener('click', () => {
  const show = keyInput.type === 'password';
  keyInput.type = show ? 'text' : 'password';
  peek.setAttribute('aria-pressed', String(show));
  peek.setAttribute('aria-label', show ? 'Hide key' : 'Show key');
  peek.classList.toggle('off', show);
  keyInput.focus();
});

// crypto — byte-format and parameters must match the publisher exe exactly
async function decrypt(buf, password) {
  const dv = new DataView(buf);
  if (buf.byteLength < 8 || dv.getUint8(0) !== 0x42 || dv.getUint8(1) !== 0x52 ||
      dv.getUint8(2) !== 0x50 || dv.getUint8(3) !== 0x31) {
    throw new Error('format');
  }
  let o = 4;
  const saltLen = dv.getUint8(o++);
  const nonceLen = dv.getUint8(o++);
  const salt = new Uint8Array(buf, o, saltLen); o += saltLen;
  const iv = new Uint8Array(buf, o, nonceLen); o += nonceLen;
  const data = new Uint8Array(buf, o, buf.byteLength - o);

  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
}

// streamed download with progress; returns { buf: ArrayBuffer, modified: string|null }
async function fetchArchive(onProgress) {
  const res = await fetch(OBJ, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch');
  const modified = res.headers.get('last-modified');
  if (!res.body) {
    const buf = await res.arrayBuffer();
    onProgress(buf.byteLength, buf.byteLength);
    return { buf, modified };
  }
  const total = Number(res.headers.get('content-length')) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    onProgress(received, total);
  }
  const merged = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { merged.set(c, off); off += c.length; }
  return { buf: merged.buffer, modified };
}

function updateProgress(received, total) {
  bytesEl.textContent = total ? fmt(received) + ' / ' + fmt(total) : fmt(received);
  if (total) {
    bar.classList.remove('indet');
    fill.style.width = Math.min(100, (received / total) * 100).toFixed(1) + '%';
  } else {
    bar.classList.add('indet');
  }
}

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = keyInput.value;
  if (!password) { status('Enter your key first.', 'err'); keyInput.focus(); return; }

  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  drive.hidden = true;   // lock the listing until this attempt succeeds
  prog.hidden = false;
  stage.textContent = 'Downloading\u2026';
  bytesEl.textContent = '0 KB';
  bar.classList.remove('indet');
  fill.style.width = '0%';
  status('Fetching the encrypted archive\u2026', 'busy');
  const t0 = performance.now();

  let pack;
  try {
    pack = await fetchArchive(updateProgress);
  } catch (err) {
    prog.hidden = true;
    if (err && err.message === 'fetch') status('Archive not found on the server yet. Publish it first.', 'err');
    else status('Network error \u2014 check your connection and try again.', 'err');
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    return;
  }

  stage.textContent = 'Decrypting\u2026';
  status('Decrypting with your key\u2026', 'busy');
  let plain;
  try {
    plain = await decrypt(pack.buf, password);
  } catch (err) {
    prog.hidden = true;
    if (err && err.message === 'format') status('Corrupted archive (bad format).', 'err');
    else status('Wrong key \u2014 nothing was downloaded.', 'err');
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    return;
  }

  // decrypted payload must start with a ZIP local-file header ("PK\x03\x04")
  const head = new Uint8Array(plain, 0, 4);
  if (head[0] !== 0x50 || head[1] !== 0x4b || head[2] !== 0x03 || head[3] !== 0x04) {
    prog.hidden = true;
    status('Wrong key \u2014 nothing was downloaded.', 'err');
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    return;
  }

  const digest = await crypto.subtle.digest('SHA-256', plain);
  const hex = [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');

  const blob = new Blob([plain], { type: 'application/zip' });
  unlockedZip = new Uint8Array(plain);
  unlockedBlob = blob;
  saveBlob(blob, 'brepos.zip');

  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  prog.hidden = true;
  status('Downloaded brepos.zip (' + Math.round(blob.size / 1024) + ' KB) in ' + secs +
         's \u00b7 sha256 ' + hex.slice(0, 8) + '\u2026', 'ok');
  try { renderDrive(unlockedZip); } catch (err) { /* listing is optional; download already succeeded */ }
  if (pack.modified) {
    fmeta.textContent = 'encrypted \u00b7 updated ' + new Date(pack.modified).toLocaleString();
  }
  btn.disabled = false;
  btn.removeAttribute('aria-busy');
});

// best-effort: show when the archive was last published
(async () => {
  try {
    const res = await fetch(OBJ, { method: 'HEAD', cache: 'no-store' });
    const lm = res.ok && res.headers.get('last-modified');
    if (lm) fmeta.textContent = 'encrypted \u00b7 updated ' + new Date(lm).toLocaleString();
  } catch (e) { /* keep default text */ }
})();
</script>
</body>
</html>
